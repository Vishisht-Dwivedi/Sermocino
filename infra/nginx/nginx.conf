events {}

http {

  upstream frontend {
    server host.docker.internal:3000;
  }

  upstream auth_service {
    server auth-service:3000;
  }

  server {
    listen 80;

    # frontend
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # auth service
    location /api/auth/ {
      proxy_pass http://auth_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

  }

}