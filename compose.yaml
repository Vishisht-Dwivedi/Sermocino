  #     - pnpm-store:/pnpm-store
  #     - .:/app

  # web:
  #   build:
  #     context: .
  #     dockerfile: clients/web/Dockerfile
  #   environment:
  #     NODE_ENV: "development"
  #     CI: "true"
  #   restart: unless-stopped
  #   networks:
  #     - sermocino-network
  #   volumes:
  #     - pnpm-store:/pnpm-store
  nginx:
    image: nginx:stable-alpine
    container_name: sermocino-nginx
    extra_hosts:
    - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # - web
      - postgres
    restart: unless-stopped
    networks:
      - sermocino-network
  media-service:
    build:
      context: .
      dockerfile: services/media-service/Dockerfile
    container_name: sermocino-media-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: 3004
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3004:3004"
    volumes:
      - ./storage:/app/storage
      - pnpm-store:/pnpm-store
    restart: unless-stopped
    networks:
      - sermocino-network
  media-worker:
    build:
      context: .
      dockerfile: services/media-worker/Dockerfile
    container_name: sermocino-media-worker
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    volumes:
      - ./storage:/app/storage
      - pnpm-store:/pnpm-store
    networks:
      - sermocino-network
volumes:
  pgdata:
  pnpm-store:

networks:
  sermocino-network:
    driver: bridge