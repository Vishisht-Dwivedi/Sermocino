services:
  postgres:
    image: postgres:18
    container_name: sermocino-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sermocino-network

  redis:
    image: redis:7-alpine
    container_name: sermocino-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - sermocino-network

  # auth-service:
  #   build:
  #     context: .
