  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     PORT: 3000
  #     DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  #     JWT_SECRET_KEY: "${JWT_SECRET}"
  #     COOKIE_SECRET: "${COOKIE_SECRET}"
  #     NODE_ENV: "development"
